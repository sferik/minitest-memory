name: RDoc Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rdoc_coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby
      - run: bundle exec rake rdoc_coverage
